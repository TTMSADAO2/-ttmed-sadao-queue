<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance</title>
    <style>
        /* ตั้งค่าฟอนต์และพื้นหลังสไตล์ GitHub */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            background-color: #f6f8fa;
            color: #24292f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* กล่องข้อความหลัก */
        .maintenance-container {
            background-color: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 40px;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 3px 6px rgba(140, 149, 159, 0.15);
        }

        /* โลโก้แผนก */
        .logo {
            width: auto;
            height: 120px; /* ปรับขนาดความสูงตามความเหมาะสม */
            margin-bottom: 20px;
            border-radius: 8px; /* เพิ่มขอบมนถ้าต้องการ */
        }

        /* รูปการ์ตูนขอโทษ */
        .apology-image {
            width: 200px;
            height: auto;
            margin: 10px auto 25px auto;
            border-radius: 8px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #24292f;
        }

        p {
            font-size: 16px;
            line-height: 1.5;
            color: #57606a;
            margin-bottom: 20px;
        }

        .highlight-date {
            display: inline-block;
            background-color: #ddf4ff;
            color: #0969da;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
            margin-top: 10px;
            border: 1px solid rgba(84, 174, 255, 0.4);
        }

        /* ปุ่มติดต่อ หรือสถานะระบบ */
        .btn {
            display: inline-block;
            padding: 5px 16px;
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            white-space: nowrap;
            vertical-align: middle;
            cursor: pointer;
            border: 1px solid;
            border-radius: 6px;
            text-decoration: none;
            background-color: #f6f8fa;
            border-color: rgba(27, 31, 36, 0.15);
            color: #24292f;
            box-shadow: 0 1px 0 rgba(27, 31, 36, 0.04);
            transition: 0.2s cubic-bezier(0.3, 0, 0.5, 1);
            margin-top: 20px;
        }

        .btn:hover {
            background-color: #f3f4f6;
            border-color: rgba(27, 31, 36, 0.15);
        }

        /* Footer links */
        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #57606a;
        }

        .footer a {
            color: #0969da;
            text-decoration: none;
            margin: 0 10px;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- เปลี่ยนเป็น โลโก้แผนกการแพทย์แผนไทยและการแพทย์ทางเลือก -->
    <img src="https://github.com/TTMSADAO2/-ttmed-sadao-queue/blob/%E0%B8%9B%E0%B8%B4%E0%B8%94%E0%B8%9B%E0%B8%A3%E0%B8%B1%E0%B8%9A%E0%B8%9B%E0%B8%A3%E0%B8%B8%E0%B8%87/%E0%B9%82%E0%B8%A5%E0%B9%82%E0%B8%81%E0%B9%89%E0%B9%81%E0%B8%9C%E0%B8%99%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%B8%E0%B9%88%E0%B8%99%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B9%80%E0%B8%AA%E0%B8%99%E0%B9%88%E0%B8%AB%E0%B9%8C.png?raw=true" alt="โลโก้หน่วยงาน" class="logo">

    <div class="maintenance-container">
        <!-- รูปแมวขอโทษ -->
        <img src="https://github.com/TTMSADAO2/-ttmed-sadao-queue/blob/%E0%B8%9B%E0%B8%B4%E0%B8%94%E0%B8%9B%E0%B8%A3%E0%B8%B1%E0%B8%9A%E0%B8%9B%E0%B8%A3%E0%B8%B8%E0%B8%87/%E0%B9%81%E0%B8%A1%E0%B8%A7%E0%B8%82%E0%B8%AD%E0%B9%82%E0%B8%97%E0%B8%A9.jpg?raw=true" alt="ก้มกราบขออภัย" class="apology-image">
        
        <h1>ขออภัยในความไม่สะดวก</h1>
        <p>เนื่องจากพบนปัญหาการใช้งานระบบไม่ได้<br>ทางเราจึงมีความจำเป็นต้องปิดปรับปรุงระบบชั่วคราว เพื่อแก้ไขปัญหาดังกล่าว</p>
        
        <div class="highlight-date">
           แอดมินรีบศึกษาและแก้ไข<br>คาดว่าจะดำเนินการแล้วเสร็จภายในวันที่ 19 ตุลาคม 2569
        </div>

        <br>
        <!-- สามารถเปลี่ยนลิงก์ไปยังเพจหรือช่องทางติดต่อได้ -->
        <a href="#" class="btn">ติดต่อเจ้าหน้าที่ โทร 084 267 1735</a>
    </div>

</body>
</html>
