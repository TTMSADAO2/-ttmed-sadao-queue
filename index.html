<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub - Under Maintenance</title>
    <style>
        /* ตั้งค่าฟอนต์และพื้นหลังสไตล์ GitHub */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            background-color: #f6f8fa;
            color: #24292f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* กล่องข้อความหลัก */
        .maintenance-container {
            background-color: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 40px;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 3px 6px rgba(140, 149, 159, 0.15);
        }

        /* โลโก้จำลอง */
        .logo {
            width: 48px;
            height: 48px;
            margin-bottom: 20px;
            fill: #24292f;
        }

        /* รูปการ์ตูนขอโทษ */
        .apology-image {
            width: 200px;
            height: auto;
            margin: 10px auto 25px auto;
            border-radius: 8px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #24292f;
        }

        p {
            font-size: 16px;
            line-height: 1.5;
            color: #57606a;
            margin-bottom: 20px;
        }

        .highlight-date {
            display: inline-block;
            background-color: #ddf4ff;
            color: #0969da;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
            margin-top: 10px;
            border: 1px solid rgba(84, 174, 255, 0.4);
        }

        /* ปุ่มติดต่อ หรือสถานะระบบ */
        .btn {
            display: inline-block;
            padding: 5px 16px;
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            white-space: nowrap;
            vertical-align: middle;
            cursor: pointer;
            border: 1px solid;
            border-radius: 6px;
            text-decoration: none;
            background-color: #f6f8fa;
            border-color: rgba(27, 31, 36, 0.15);
            color: #24292f;
            box-shadow: 0 1px 0 rgba(27, 31, 36, 0.04);
            transition: 0.2s cubic-bezier(0.3, 0, 0.5, 1);
            margin-top: 20px;
        }

        .btn:hover {
            background-color: #f3f4f6;
            border-color: rgba(27, 31, 36, 0.15);
        }

        /* Footer links */
        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #57606a;
        }

        .footer a {
            color: #0969da;
            text-decoration: none;
            margin: 0 10px;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <svg class="logo" viewBox="0 0 16 16" version="1.1" aria-hidden="true">
        <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
    </svg>

    <div class="maintenance-container">
        <!-- ใส่ชื่อไฟล์รูปภาพที่ได้เจนขึ้นมาในช่อง src -->
        <img src="https://github.com/TTMSADAO2/-ttmed-sadao-queue/blob/%E0%B8%9B%E0%B8%B4%E0%B8%94%E0%B8%9B%E0%B8%A3%E0%B8%B1%E0%B8%9A%E0%B8%9B%E0%B8%A3%E0%B8%B8%E0%B8%87/%E0%B9%81%E0%B8%A1%E0%B8%A7%E0%B8%82%E0%B8%AD%E0%B9%82%E0%B8%97%E0%B8%A9.jpg?raw=true" alt="ก้มกราบขออภัย" class="apology-image">
        
        <h1>ขออภัยในความไม่สะดวก</h1>
        <p>เนื่องจากพบการรายงานปัญหาการใช้งานระบบไม่ได้<br>ทางเราจึงมีความจำเป็นต้องปิดปรับปรุงระบบชั่วคราว เพื่อแก้ไขปัญหาดังกล่าว</p>
        
        <div class="highlight-date">
            แอดมินรีบศึกษาและแก้ไขปัญหา คาดว่าจะดำเนินการแล้วเสร็จภายในวันที่ 19 ตุลาคม 2569
        </div>
    </div>

    <div class="footer">
        <a href="#">Terms</a>
        <a href="#">Privacy</a>
        <a href="#">Security</a>
        <a href="#">Contact Support</a>
    </div>

</body>
</html>
